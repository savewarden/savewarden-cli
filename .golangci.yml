version: "2"
run:
  timeout: 5m
linters:
  default: none
  enable:
    - errcheck
    - errorlint
    - gosec
    - govet
    - ineffassign
    - staticcheck
    - unused
  exclusions:
    rules:
      # Tests build and launch the binary under test (G204) and read their
      # own synthetic fixtures from computed paths (G304) on purpose.
      - path: _test\.go
        linters: [gosec]
        text: G204|G304
formatters:
  enable:
    - gofmt
